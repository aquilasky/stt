name: Feature
description: Propose a scoped LectureCaption capability
title: "[Feature]: "
labels:
  - feature
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe the user outcome, not only the implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that must be true when complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: State what this feature deliberately does not include.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Audio
        - STT
        - Translation
        - Caption UI
        - Session and storage
        - Security
        - Export
        - App infrastructure
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and dependencies
      description: Include permissions, API contracts, migration, cost, or performance concerns.
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: List automated tests and manual scenarios.
    validations:
      required: true
